name: Daily Brain Organize

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC يومياً = 05:00 بتوقيت غزة
  workflow_dispatch:

jobs:
  organize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: تنظيم وتنقية الدماغ
        run: python3 scripts/organize_brain.py

      - name: تحديث تاريخ آخر تحديث في README
        run: |
          DATE=$(date +"%Y-%m-%d")
          sed -i "s/_آخر تحديث:.*/_آخر تحديث: $DATE_/" README.md

      - name: Commit إذا يوجد تغيير
        run: |
          git config user.name  "sajed-brain[bot]"
          git config user.email "brain@dev-saged.local"
          git add -A
          git diff --cached --quiet || \
            git commit -m "brain: daily organize $(date +%Y-%m-%d)"
          git push
