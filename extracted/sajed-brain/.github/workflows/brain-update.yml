name: Brain Update

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'الملف المراد التحديث (مثال: mistakes.md أو ideas.md)'
        required: true
        type: string
      action:
        description: 'append = أضف في النهاية | replace_section = استبدل قسماً'
        required: true
        default: append
        type: choice
        options: [append, replace_section]
      content:
        description: 'المحتوى المراد إضافته أو القسم الجديد'
        required: true
        type: string
      section_header:
        description: 'عنوان القسم للاستبدال (فقط مع replace_section)'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: تطبيق التحديث
        env:
          FILE: ${{ inputs.file }}
          ACTION: ${{ inputs.action }}
          CONTENT: ${{ inputs.content }}
          SECTION: ${{ inputs.section_header }}
        run: |
          python3 scripts/update_brain.py \
            --file "$FILE" \
            --action "$ACTION" \
            --content "$CONTENT" \
            ${SECTION:+--section "$SECTION"}

      - name: Commit
        run: |
          git config user.name  "sajed-brain[bot]"
          git config user.email "brain@dev-saged.local"
          git add -A
          git diff --cached --quiet || \
            git commit -m "brain: update ${{ inputs.file }} [auto]"
          git push
