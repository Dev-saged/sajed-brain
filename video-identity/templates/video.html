<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sajed video scene</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bgDark)}
body{font-family:'Alexandria',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:'Inter','Alexandria',sans-serif}
.n{color:var(--numbers)}.a{color:var(--accent)}
.bar{position:absolute;bottom:0;right:0;height:10px;background:var(--accent)}
/* البداية */
#hook{background:var(--bgDark)}
#hook .grid{position:absolute;inset:-120px;background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:120px 120px;opacity:.35}
#hook .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(212,166,74,.22),transparent 62%)}
/* المنطقة الآمنة للريلز: لا نص في أسفل 380px ولا في يمين 160px من النصف السفلي */
#hook .wrap{position:absolute;inset:0;padding:120px 160px 400px 96px;display:flex;flex-direction:column;justify-content:space-between}
.chip{display:flex;align-items:center;gap:32px}
.chip img{width:156px;height:156px;border-radius:50%;object-fit:cover;border:6px solid var(--accent)}
.chip b{display:block;font-size:58px;font-weight:600}
.chip span{display:block;font-family:'Readex Pro',sans-serif;font-size:44px;color:var(--mute);margin-top:6px}
.term{font-family:'JetBrains Mono',monospace;font-size:38px;color:var(--mute);direction:ltr;text-align:left;margin-bottom:40px;white-space:pre}
.head{font-size:132px;font-weight:800;line-height:1.22;white-space:pre-line;min-height:330px}
.cur{color:var(--accent)}
.sub{font-family:'Readex Pro',sans-serif;font-size:58px;color:var(--mute);margin-top:44px}
/* العرض */
#demo{background:var(--bgLight);color:var(--inkOnLight)}
#demo .wrap{position:absolute;inset:0;padding:96px 88px 340px;display:flex;flex-direction:column;align-items:center;gap:44px}
.phone{width:340px;height:680px;border-radius:72px;border:16px solid var(--inkOnLight);background:var(--bgDark);overflow:hidden;box-shadow:0 60px 90px -40px rgba(15,61,62,.55)}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.ph{padding:44px 28px;display:flex;flex-direction:column;gap:28px;height:100%}
.ph i{display:block;border-radius:24px;background:var(--line)}
.stats{width:800px;border-radius:48px;background:var(--bgDark);color:var(--ink);padding:44px 52px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:44px}
.row span{color:var(--mute);font-family:'Readex Pro',sans-serif}
.row b{font-family:'Inter',sans-serif;font-weight:700;font-size:56px}
.track{height:22px;border-radius:11px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:11px}
.dhead{font-size:96px;font-weight:800;line-height:1.3;text-align:center;white-space:pre-line}
.dhead .a{color:inherit;background:linear-gradient(transparent 62%,var(--accent) 62%)}
.pill{background:var(--bgDark);color:var(--ink);font-family:'Readex Pro',sans-serif;font-weight:600;font-size:52px;padding:26px 56px;border-radius:40px}
/* الخاتمة */
#outro{background:var(--bgDark)}
#outro .wrap{position:absolute;inset:0;padding:120px 96px;display:flex;flex-direction:column;align-items:center;text-align:center}
#outro .pic{width:336px;height:336px;border-radius:50%;object-fit:cover;border:12px solid var(--accent)}
#outro h1{font-size:92px;font-weight:800;margin-top:44px}
#outro p{font-family:'Readex Pro',sans-serif;font-size:52px;color:var(--mute);margin-top:12px}
.tiles{width:820px;display:flex;flex-direction:column;gap:24px;margin-top:64px}
.tile{direction:ltr;display:flex;align-items:center;gap:36px;height:124px;padding:0 36px 0 18px;border-radius:38px;background:var(--tileBg);border:2px solid var(--tileBorder)}
.tile .ib{width:88px;height:88px;border-radius:26px;background:var(--iconBg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile b{font-family:'Inter',sans-serif;font-weight:700;font-size:54px;color:var(--handle);letter-spacing:1px;white-space:nowrap}
</style>
</head>
<body>
<section class="scene" id="hook">
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
<div class="chip"><img class="portrait" alt=""><div><b class="name"></b><span class="intro"></span></div></div>
<div><div class="term"></div><div class="head"></div><div class="sub"></div></div>
</div>
<div class="bar"></div>
</section>
<section class="scene" id="demo">
<div class="wrap">
<div class="phone"></div>
<div class="stats">
<div class="row"><span class="bl"></span><b class="bv n ltr"></b></div>
<div class="track"><div class="fill fb" style="background:var(--mute)"></div></div>
<div class="row"><span class="al"></span><b class="av a ltr"></b></div>
<div class="track"><div class="fill fa" style="background:var(--accent)"></div></div>
</div>
<div class="dhead"></div>
<div class="pill"></div>
</div>
<div class="bar"></div>
</section>
<section class="scene" id="outro">
<div class="wrap">
<img class="pic portrait" alt="">
<h1 class="name"></h1>
<p class="outro"></p>
<div class="tiles"></div>
</div>
<div class="bar"></div>
</section>
<script>
(() => {
  const B = window.__BRAND;
  if (!B) { document.body.textContent = 'شغّل عبر render.py'; return; }
  const T = B.tokens, C = B.content, $ = (s, r = document) => r.querySelector(s);
  const vars = { ...T.color, tileBg: T.accountTile.bg, tileBorder: T.accountTile.border, iconBg: T.accountTile.iconBg, handle: T.accountTile.handle };
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty('--' + k, v);

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // [نص]=لون الأرقام {نص}=اللون الأساسي
  const tokens = src => {
    const out = []; let cls = '';
    for (const ch of src) {
      if (ch === '[') cls = 'n'; else if (ch === '{') cls = 'a';
      else if (ch === ']' || ch === '}') cls = '';
      else out.push({ ch, cls });
    }
    return out;
  };
  const html = (tk, n = tk.length) => {
    let s = '', open = null;
    for (const { ch, cls } of tk.slice(0, n)) {
      if (cls !== open) { if (open) s += '</span>'; if (cls) s += `<span class="${cls} ltr">`; open = cls; }
      s += esc(ch);
    }
    return open ? s + '</span>' : s;
  };
  const clamp = v => Math.min(1, Math.max(0, v));
  const p = (t, a, d) => clamp((t - a) / d);
  const out3 = x => 1 - Math.pow(1 - x, 3);
  const back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  const show = (el, x, dy = 0, dx = 0, sc = 1) => { el.style.opacity = x; el.style.transform = `translate(${dx}px,${dy}px) scale(${sc})`; };

  const I = T.identity, A = B.assets;
  document.querySelectorAll('.portrait').forEach(i => i.src = A.portrait);
  document.querySelectorAll('.name').forEach(e => e.textContent = I.name);
  $('.intro').textContent = I.introTag;
  $('.outro').textContent = I.outroTag;

  const scenes = {
    hook: () => {
      const s = $('#hook'), term = `${I.terminalPath} $ ${C.command || 'run'}`, head = tokens(C.headline);
      $('.sub', s).textContent = C.sub || '';
      const typeEnd = 1000 + head.length * 42;
      return t => {
        $('.glow', s).style.transform = `translate(${-200 + 160 * Math.sin(t / 1400)}px,${300 + 120 * Math.cos(t / 1700)}px)`;
        $('.grid', s).style.transform = `translateY(${(t / 40) % 120}px)`;
        const c = p(t, 0, 600); show($('.chip', s), out3(c), -60 * (1 - out3(c)));
        $('.term', s).textContent = term.slice(0, Math.round(term.length * p(t, 250, 650)));
        const n = Math.round(head.length * p(t, 1000, typeEnd - 1000));
        const blink = t > typeEnd && Math.floor((t - typeEnd) / 530) % 2 === 1;
        $('.head', s).innerHTML = html(head, n) + (blink ? '' : '<span class="cur">▍</span>');
        const u = p(t, typeEnd, 400); show($('.sub', s), out3(u), 30 * (1 - out3(u)));
      };
    },
    demo: () => {
      const s = $('#demo'), d = C.demo;
      $('.phone', s).innerHTML = A.screenshot ? `<img src="${esc(A.screenshot)}" alt="">` : '<div class="ph"><i style="height:24px;width:50%;background:var(--accent)"></i><i style="height:140px"></i><i style="height:140px"></i><i style="height:140px"></i></div>';
      $('.bl', s).textContent = d.before.label; $('.bv', s).textContent = d.before.value;
      $('.al', s).textContent = d.after.label; $('.av', s).textContent = d.after.value;
      $('.dhead', s).innerHTML = html(tokens(d.headline));
      $('.pill', s).textContent = d.caption;
      $('.fb', s).style.width = '100%';
      return t => {
        const ph = back(p(t, 0, 800)); show($('.phone', s), clamp(ph), 260 * (1 - ph)); $('.phone', s).style.rotate = `${-4 * (1 - ph)}deg`;
        const st = out3(p(t, 450, 500)); show($('.stats', s), st, 50 * (1 - st));
        $('.fa', s).style.width = (100 - (100 - d.after.ratio * 100) * out3(p(t, 900, 1100))) + '%';
        const h = out3(p(t, 1700, 500)); show($('.dhead', s), h, 40 * (1 - h));
        const c = back(p(t, 2300, 500)); show($('.pill', s), clamp(c), 0, 0, 0.8 + 0.2 * c);
      };
    },
    outro: () => {
      const s = $('#outro'), list = $('.tiles', s), ic = B.icons, k = T.accountTile;
      list.innerHTML = Object.values(ic.icons).map(v => `<div class="tile"><div class="ib"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="${k.iconStroke}" stroke-width="${k.iconStrokeWidth}" stroke-linecap="round" stroke-linejoin="round"><path d="${v.d}"/></svg></div><b>${esc(v.handle)}</b></div>`).join('');
      const tiles = [...list.children];
      return t => {
        const pic = back(p(t, 0, 700)); show($('.pic', s), clamp(pic), 0, 0, 0.6 + 0.4 * pic);
        const n = out3(p(t, 350, 500)); show($('h1', s), n, 30 * (1 - n));
        const o = out3(p(t, 550, 500)); show($('p', s), o, 30 * (1 - o));
        tiles.forEach((el, i) => { const x = out3(p(t, 800 + i * 120, 450)); show(el, x, 0, -80 * (1 - x)); });
      };
    }
  };

  const name = new URLSearchParams(location.search).get('scene') || 'hook';
  const scene = $('#' + name); scene.classList.add('on');
  const dur = (C.durations && C.durations[name] || { hook: 3.5, demo: 5, outro: 4.5 }[name]) * 1000;
  window.__duration = dur;
  const run = scenes[name]();
  window.__seek = t => {
    run(t);
    $('.bar', scene).style.width = (100 * t / dur) + '%';
    scene.style.opacity = out3(p(t, 0, 250));
  };
  window.__seek(0);
})();
</script>
</body>
</html>
