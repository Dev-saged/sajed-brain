<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Talk compositor v2</title>
<link rel="stylesheet" href="../templates/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:clip;background:#000}
.cap,.paper,.pills,.ringlabel,.pop,.card,#behind,.quote{direction:rtl}
body{font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff}
:root{--title:'El Messiri'}
.layer{position:absolute;inset:0}
#bg{background:radial-gradient(120% 80% at 50% 20%,var(--b1),var(--b2));opacity:0}
#vidwrap{position:absolute;inset:0;overflow:hidden;transform-origin:50% 60%}
#vid,#person{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#person{display:none}
#behind{position:absolute;left:0;right:0;text-align:center;font-family:var(--title);font-weight:700;font-size:300px;line-height:1.05;white-space:nowrap;opacity:0;color:var(--accent);text-shadow:0 20px 50px rgba(0,0,0,.45)}
canvas{position:absolute;inset:0}
/* إعادة إضاءة: صبغة المزاج على الظلال + ضوء يتبع الوجه (مرجع ذهبي) */
#tint{background:var(--b1);mix-blend-mode:soft-light;opacity:.55}
#leak{mix-blend-mode:screen;opacity:0;background:linear-gradient(115deg,transparent 30%,var(--accentGlow) 46%,rgba(255,255,255,.55) 50%,var(--accentGlow) 54%,transparent 70%)}
/* رأس ورقي يُكتب فيه العنوان عند تصغير الفيديو لنافذة */
.paper{position:absolute;left:90px;right:90px;top:120px;padding:44px 50px;border-radius:36px;background:#f6f1e7;color:#141414;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);opacity:0;text-align:center}
.paper .num{font-family:'Inter',sans-serif;font-weight:700;font-size:40px;color:var(--accentDark);letter-spacing:2px}
.paper h2{font-family:var(--title);font-size:84px;font-weight:700;line-height:1.25;min-height:105px}
.paper p{font-size:40px;font-weight:500;color:#555;margin-top:6px;min-height:52px}
.ring{position:absolute;border-radius:50%;border:5px solid var(--accent);box-shadow:0 0 40px var(--accentGlow),inset 0 0 30px var(--accentGlow);opacity:0}
.ring::before{content:'';position:absolute;inset:-24px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.ringlabel{position:absolute;background:var(--accent);color:#111;font-weight:700;font-size:42px;padding:10px 28px;border-radius:28px;white-space:nowrap;opacity:0;transform:translateX(-50%)}
/* أقراص معلومات بيضاء تتمدد بتوهج ثم يُكتب نصها */
.pills{position:absolute;left:50px;right:50px;bottom:575px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:14px}
.pills .t{flex-basis:100%;text-align:center}
.pills .t{font-family:var(--title);font-size:56px;font-weight:700;color:var(--accent);text-shadow:0 4px 18px rgba(0,0,0,.6);min-height:70px}
.pill{position:relative;background:#fbfaf7;color:#111;border-radius:999px;padding:16px 36px;font-size:44px;font-weight:600;white-space:nowrap;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);overflow:hidden;min-height:78px;min-width:60px}
.pill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--accentGlow) 50%,transparent 70%);transform:translateX(var(--sweep,120%))}
.phone{position:absolute;left:70px;top:330px;width:470px;height:960px;border-radius:72px;background:#0b0f10;padding:18px;box-shadow:0 60px 120px -30px rgba(0,0,0,.75),0 0 0 3px #2b3a3b;opacity:0}
.phone img{width:100%;height:100%;object-fit:cover;border-radius:56px;display:block}
.phone::before{content:'';position:absolute;top:34px;left:50%;width:140px;height:36px;margin-left:-70px;border-radius:20px;background:#000;z-index:1}
/* أيقونة مصممة داخل بلاطة زجاجية متوهجة بجانب الصدر */
.tile{border-radius:22%;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:2px solid color-mix(in oklab,var(--accent) 55%,transparent);box-shadow:0 0 60px var(--accentGlow),inset 0 0 40px rgba(255,255,255,.06),0 40px 70px -25px rgba(0,0,0,.7);backdrop-filter:blur(18px);display:grid;place-items:center}
.tile svg{width:58%;height:58%;color:var(--accent);filter:drop-shadow(0 0 22px var(--accentGlow))}
.prop{position:absolute;width:250px;height:250px;opacity:0}
.card{position:absolute;inset:0;opacity:0;overflow:hidden;background:radial-gradient(110% 70% at 50% 38%,var(--b1),var(--b2))}
.card .halo{position:absolute;left:50%;top:760px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(circle,var(--accentGlow),transparent 62%)}
.card .obj{position:absolute;left:50%;top:760px;width:520px;height:520px;margin:-260px 0 0 -260px}
.card .ghost{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:var(--title);font-weight:700;font-size:300px;line-height:1;white-space:nowrap;color:var(--accent);opacity:.16}
.card .typo{position:absolute;left:70px;right:70px;top:620px;text-align:center;font-family:var(--title);font-weight:700;font-size:170px;line-height:1.2;color:var(--accent);text-shadow:0 0 50px var(--accentGlow)}
.card img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* الكابشن: سطر 3-4 كلمات يُكتب حرفاً حرفاً مع الكلام، يظهر مرة واحدة */
/* كابشن العبارة (GRAMMAR §1): صفوف بهرمية، الكلمات تتراكم في مكانها، صف الذروة أكبر بتدرج ذهبي */
.cap{position:absolute;left:80px;width:920px;top:1180px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:58px;font-weight:700;line-height:1.3;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9)}
.cap .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 16px}
.cap .w{display:inline-block}
.cap .big{font-family:var(--title);font-size:104px;line-height:1.12}
.cap .big .w{background:linear-gradient(180deg,#fff 0%,var(--accent) 72%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 16px var(--accentGlow)) drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.cap .big .lat{font-family:'Inter',sans-serif;font-weight:800}
/* مشهد (GRAMMAR §2): خلفية المزاج + عنصر متوهج + كلمة باهتة ضخمة + عنوان الكلام نفسه يتراكم أعلاه */
.scene,.flow{position:absolute;inset:0;opacity:0;overflow:hidden;direction:rtl}
.scene .sbg,.flow .sbg{position:absolute;inset:-6%;background:radial-gradient(85% 55% at 50% 52%,color-mix(in oklab,var(--b1) 80%,var(--accent) 20%),var(--b2) 75%)}
.scene .ghost{position:absolute;left:-40px;right:-40px;top:520px;text-align:center;font-family:var(--title);font-weight:700;font-size:340px;line-height:1;white-space:nowrap;color:var(--accent);opacity:.18}
.scene .hero{position:absolute;left:50%;top:1010px;width:600px;height:600px;margin:-300px 0 0 -300px}
.scene .hero.tile svg{width:56%;height:56%}
.scene img.hero{object-fit:contain;filter:drop-shadow(0 0 60px var(--accentGlow))}
.scene .stitle{position:absolute;left:60px;right:60px;top:230px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;font-family:var(--title);font-weight:700;font-size:108px;line-height:1.25;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.scene .stitle .g{display:inline-flex;gap:0 20px;direction:ltr;unicode-bidi:isolate}
.scene .stitle .lat{font-family:'Inter',sans-serif;font-weight:800}
.scene .stitle .a,.flow .a{color:var(--accent)}
.flow .stack{position:absolute;left:60px;right:60px;top:0;height:1920px}
.flow .ph{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-shadow:0 0 28px rgba(255,255,255,.25),0 6px 24px rgba(0,0,0,.6)}
.flow .sm{font-size:62px;font-weight:600;opacity:.85}
.flow .bg2{font-family:var(--title);font-weight:700;font-size:150px;line-height:1.1;color:#fff;text-shadow:0 0 40px var(--accentGlow),0 0 12px rgba(255,255,255,.5)}
/* كبسولة اقتباس/آية بخط نسخي مشكول */
.quote{position:absolute;left:110px;right:110px;top:1240px;padding:22px 34px;border-radius:28px;background:rgba(8,12,16,.55);border:2px solid color-mix(in oklab,var(--accent) 45%,transparent);backdrop-filter:blur(14px);font-family:'Amiri',serif;font-size:56px;line-height:1.6;text-align:center;opacity:0;direction:rtl}
#flash{background:#fff;opacity:0}
#orb{opacity:0;background:radial-gradient(circle at 50% 46%,#fff 0,#fff var(--r,0%),rgba(255,255,255,.0) calc(var(--r,0%) + 14%))}
.cap .g{display:inline-flex;gap:0 16px;direction:ltr;unicode-bidi:isolate}
.cap .lat{font-family:'Inter','IBM Plex Sans Arabic',sans-serif;font-weight:600}
.pop{position:absolute;left:50%;top:22%;max-width:900px;width:max-content;background:var(--b2);border:3px solid var(--accent);border-radius:36px;padding:26px 46px;font-size:72px;font-weight:700;line-height:1.25;text-align:center}
.pop .a{color:var(--accent)}.pop .n{color:var(--accent2)}
.ltr{direction:ltr;unicode-bidi:isolate}
.bar{position:absolute;bottom:0;right:0;height:8px;background:var(--accent)}
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<div id="vidwrap"><img id="vid" alt=""><div id="behind"></div><img id="person" alt=""></div>
<canvas id="light" width="1080" height="1920"></canvas>
<div id="tint" class="layer"></div>
<canvas id="fx" width="1080" height="1920"></canvas>
<div class="paper"><div class="num"></div><h2></h2><p></p></div>
<div class="ring"></div><div class="ringlabel"></div>
<div class="pills"></div>
<div class="phone"><img alt=""></div>
<div class="prop tile"></div>
<div class="card"></div>
<div class="scene"></div>
<div class="flow"><div class="sbg"></div><div class="stack"></div></div>
<div class="quote"></div>
<div class="pop" style="opacity:0"></div>
<div class="cap"></div>
<div id="leak" class="layer"></div>
<div id="orb" class="layer"></div>
<div id="flash" class="layer"></div>
<div class="bar"></div>
<script>
(() => {
  const D = window.__TALK, M = D.mood, $ = s => document.querySelector(s), root = document.documentElement.style;
  const hex2rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  root.setProperty('--b1', M.bg[0]); root.setProperty('--b2', M.bg[1]); root.setProperty('--accent', M.accent); root.setProperty('--accent2', M.accent2);
  root.setProperty('--accentGlow', hex2rgba(M.accent, 0.45)); root.setProperty('--accentDark', M.bg[0]); root.setProperty('--title', `'${M.title}'`);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mark = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="n ltr">$1</span>').replace(/\{([^}]+)\}/g, '<span class="a">$1</span>');
  const clamp = v => Math.min(1, Math.max(0, v));
  const back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  const out3 = x => 1 - Math.pow(1 - x, 3);
  const io = (t, a, b, f = 0.35) => Math.min(clamp((t - a) / f), clamp((b - t) / f));
  const typed = (s, t, a, cps = 28) => { const ch = [...s]; return ch.slice(0, Math.max(0, Math.min(ch.length, Math.floor((t - a) * cps)))).join(''); };
  window.__issues = [];

  const NOJOIN = 'اأإآدذرزوؤةى';
  const kashida = (w, n = 3) => {
    const ch = [...w], ok = [];
    for (let i = 0; i < ch.length - 1; i++) if (/[ء-ي]/.test(ch[i]) && /[ء-ي]/.test(ch[i + 1]) && !NOJOIN.includes(ch[i]) && ch[i] !== 'ء') ok.push(i);
    if (!ok.length) return w;
    const k = ok[Math.floor(ok.length / 2)];
    return ch.slice(0, k + 1).join('') + 'ـ'.repeat(n) + ch.slice(k + 1).join('');
  };
  const K = s => D.kashida ? s.split(' ').map((w, i, a) => i === a.length - 1 ? kashida(w) : w).join(' ') : s;
  const core = w => w.replace(/[،؟.!,?]/g, '');
  const isLat = w => { const c = core(w); return /[A-Za-z]/.test(c) && !/[؀-ۿ]/.test(c); };
  const kws = new Set([...(D.keywords || []), ...(D.emphasis || [])]);

  // عبارات الكابشن (GRAMMAR §1): تنكسر عند الوقفات ونهايات الجمل، 2–6 كلمات، كلماتها تتراكم في أماكنها مع الكلام
  const phrases = [];
  for (const w of D.words) {
    const P = phrases[phrases.length - 1], prev = P && P.words[P.words.length - 1];
    const brk = P && (P.words.length >= 6 || w.s - prev.e > 0.28 || (/[.؟!?،,]$/.test(prev.w) && P.words.length >= 2));
    if (!P || brk) phrases.push({ words: [w] }); else P.words.push(w);
  }
  phrases.forEach(P => { P.a = P.words[0].s - 0.06; });
  phrases.forEach((P, i) => { const nx = phrases[i + 1]; P.b = Math.min(nx ? nx.a : Infinity, P.words[P.words.length - 1].e + 0.7); });
  // صفوف العبارة: كلمة الذروة (keywords/emphasis) صف كبير مستقل؛ بدونها آخر كلمة في عبارة ≥3 كلمات
  const rowsOf = ws => {
    let k = ws.findIndex(w => kws.has(core(w.w)));
    if (k < 0 && ws.length >= 3 && [...core(ws[ws.length - 1].w)].length >= 3) k = ws.length - 1;
    if (k < 0) return [{ big: false, ws }];
    return [{ big: false, ws: ws.slice(0, k) }, { big: true, ws: [ws[k]] }, { big: false, ws: ws.slice(k + 1) }].filter(r => r.ws.length);
  };
  const wordHtml = (w, t) => {
    const q = clamp((t - w.s + 0.04) / 0.22);
    const st = q <= 0 ? 'opacity:0' : q >= 1 ? '' : `opacity:${q.toFixed(2)};filter:blur(${(10 * (1 - q)).toFixed(1)}px);transform:translateY(${(8 * (1 - q)).toFixed(1)}px)`;
    return `<span class="w${isLat(w.w) ? ' lat' : ''}" style="${st}">${esc(w.w)}</span>`;
  };
  const rowHtml = (ws, t) => {
    let html = '', i = 0;
    while (i < ws.length) {
      if (isLat(ws[i].w)) { let g = ''; while (i < ws.length && isLat(ws[i].w)) { g += wordHtml(ws[i], t); i++; } html += `<span class="g">${g}</span>`; }
      else { html += wordHtml(ws[i], t); i++; }
    }
    return html;
  };
  // سطح نص واحد (GRAMMAR القاعدة 0): فترات العناصر التي تحمل نصاً — الكابشن يغيب أثناءها ولا يعيد ما قيل فيها
  const textSpans = [
    ...(D.cards || []).filter(c => ['typo', 'scene', 'flow'].includes(c.type) || c.text).map(c => [c.at - 0.05, c.at + (c.dur || 1.6)]),
    ...(D.quotes || []).map(x => [x.from - 0.2, x.to]),
    ...['ui', 'frames', 'behind', 'phones'].flatMap(k => (D[k] || []).map(x => [x.from - 0.3, x.to])),
    ...(D.spotlight || []).filter(x => x.label).map(x => [x.from - 0.3, x.to]),
    ...(D.pops || []).map(p => [p.at - 0.05, p.at + 1.6]),
  ];
  const surfaceBusy = t => textSpans.some(([a, b]) => t >= a && t <= b);
  const consumedUntil = t => Math.max(-1, ...textSpans.filter(([, b]) => b <= t).map(([, b]) => b));
  const phraseHtml = (P, t) => rowsOf(P.words.filter(w => w.s >= consumedUntil(t) - 0.05)).map(r => `<div class="row${r.big ? ' big' : ''}">${rowHtml(r.ws, t)}</div>`).join('');

  // الأجواء + تدرج سفلي ناعم لوضوح الكابشن
  const cv = $('#fx'), g = cv.getContext('2d');
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rain = Array.from({ length: 150 }, () => ({ x: rnd() * 1300 - 110, y: rnd() * 1920, l: 40 + rnd() * 70, v: 1500 + rnd() * 900, a: 0.1 + rnd() * 0.2 }));
  const motes = Array.from({ length: 60 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 2 + rnd() * 5, v: 30 + rnd() * 60, p: rnd() * 6.28 }));
  const steam = Array.from({ length: 26 }, () => ({ x: 380 + rnd() * 320, o: rnd() * 3, r: 60 + rnd() * 70 }));
  const acc = M.accent;
  const drawFx = (t, cardOn) => {
    g.clearRect(0, 0, 1080, 1920);
    for (const f of D.fx || []) {
      const k = io(t, f.from ?? f.at, f.to ?? (f.at + (f.dur || 3)), 0.6); if (!k) continue;
      if (f.type === 'rain') {
        g.lineCap = 'round';
        for (const d of rain) { const y = (d.y + t * d.v) % 2100 - 120, x = d.x + (y + 120) * 0.18; g.strokeStyle = `rgba(225,238,248,${d.a * k})`; g.lineWidth = 2.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + d.l * 0.18, y + d.l); g.stroke(); }
      } else if (f.type === 'steam') {
        for (const s of steam) { const life = ((t * 0.45 + s.o) % 3) / 3, y = 1500 - life * 900, x = s.x + Math.sin(t * 1.3 + s.o * 4) * 60 * life, r = s.r * (1 + life); const grd = g.createRadialGradient(x, y, 0, x, y, r); grd.addColorStop(0, `rgba(255,255,255,${0.14 * (1 - life) * k})`); grd.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); }
      } else if (f.type === 'fire') {
        const fl = 0.75 + 0.25 * Math.sin(t * 9) * Math.sin(t * 5.3), grd = g.createRadialGradient(540, 2100, 100, 540, 2100, 1300);
        grd.addColorStop(0, `rgba(255,140,40,${0.35 * k * fl})`); grd.addColorStop(1, 'rgba(255,90,20,0)'); g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
      } else if (f.type === 'sparkle') {
        for (const m of motes) { const y = 1920 - ((m.y + t * m.v) % 1920), tw = 0.5 + 0.5 * Math.sin(t * 3 + m.p); g.fillStyle = hex2rgba(acc, 0.55 * k * tw); g.beginPath(); g.arc(m.x, y, m.r, 0, 6.283); g.fill(); }
      }
    }
    if (!cardOn) {
      const v = g.createRadialGradient(540, 820, 520, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.38)'); g.fillStyle = v; g.fillRect(0, 0, 1080, 1920);
      const b = g.createLinearGradient(0, 1150, 0, 1920); b.addColorStop(0, 'rgba(0,0,0,0)'); b.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = b; g.fillRect(0, 1150, 1080, 770);
    }
  };

  const cardEl = $('.card'), propEl = $('.prop');
  const sceneEl = $('.scene'), flowEl = $('.flow');
  const spokenIn = (a, b) => D.words.filter(w => w.s >= a - 0.1 && w.s < b);
  const accentWord = (c, w) => kws.has(core(w.w)) || (c.accent || []).includes(core(w.w));
  const buildScene = c => {
    const hero = c.src ? `<img class="hero" src="${esc(c.src)}" alt="">` : `<div class="hero tile">${c.svg || ''}</div>`;
    sceneEl.innerHTML = `<div class="sbg"></div>${c.ghost ? `<div class="ghost">${esc(K(c.ghost))}</div>` : ''}${hero}<div class="stitle"></div>`;
    const gh = sceneEl.querySelector('.ghost');
    if (gh) { gh.style.fontSize = '340px'; const r = document.createRange(); r.selectNodeContents(gh); const wd = r.getBoundingClientRect().width; if (wd > 1040) gh.style.fontSize = Math.floor(340 * 1040 / wd) + 'px'; }
  };
  // عنوان المشهد = الكلام نفسه يتراكم بتوقيته (أو title صريح يُوزَّع على أول 1.2ث)
  const sceneWords = c => c.title ? c.title.split(' ').map((w, i, a) => ({ w, s: c.at + 0.1 + i * Math.min(0.35, 1.2 / a.length), e: 0 })) : spokenIn(c.at, cardEnd(c));
  const renderScene = (c, t) => {
    const p = clamp((t - c.at) / (cardEnd(c) - c.at)), lit = 0.35 + 0.65 * out3(clamp((t - c.at) / 0.3));
    sceneEl.querySelector('.sbg').style.transform = `scale(${1 + 0.07 * p})`;
    sceneEl.querySelector('.sbg').style.filter = `brightness(${lit.toFixed(2)})`;
    const hero = sceneEl.querySelector('.hero'); hero.style.transform = `translateY(${(Math.sin(t * 1.8) * 10).toFixed(1)}px) scale(${(0.92 + 0.12 * p).toFixed(3)})`; hero.style.opacity = lit.toFixed(2);
    const gh = sceneEl.querySelector('.ghost'); if (gh) gh.style.transform = `translateX(${(-40 * p).toFixed(1)}px)`;
    // العنوان يعرض العبارة الجارية فقط (2–5 كلمات كالمراجع) ويُكمَّل بتوقيت الكلام
    const sw = sceneWords(c), ph = [];
    for (const w of sw) { const C = ph[ph.length - 1]; if (!C || w.s - C[C.length - 1].s > 0.9 || C.length >= 5) ph.push([w]); else C.push(w); }
    const curP = ph.filter(C => C[0].s - 0.06 <= t).pop() || ph[0] || [];
    sceneEl.querySelector('.stitle').innerHTML = rowHtml(curP, t).replace(/class="w([^"]*)"([^>]*)>([^<]*)</g, (m, cl, st, txt) => `class="w${cl}${kws.has(core(txt)) || (c.accent || []).includes(core(txt)) ? ' a' : ''}"${st}>${txt}<`);
  };
  // تدفق نص على خلفية فارغة يتمرر عمودياً (عربي موشن 7.75–10.25)
  const renderFlow = (c, t) => {
    const ws = spokenIn(c.at, cardEnd(c)), chunks = [];
    // دفعات من كلمتين: صغيرة ثم كبيرة (شركهم / بالله، سيكون / سبباً)، وكلمة الذروة دائماً كبيرة
    for (const w of ws) { const C = chunks[chunks.length - 1]; if (!C || w.s - C[C.length - 1].e > 0.25 || C.length >= 2 || kws.has(core(C[C.length - 1].w))) chunks.push([w]); else C.push(w); }
    let cur = 0; chunks.forEach((C, i) => { if (C[0].s - 0.06 <= t) cur = i; });
    const since = chunks.length ? clamp((t - chunks[cur][0].s + 0.06) / 0.3) : 1, shift = cur - 1 + out3(since);
    flowEl.querySelector('.stack').innerHTML = chunks.map((C, i) => {
      const d = i - shift, y = 820 + d * 300, op = i > cur ? 0 : i === cur ? 1 : cur - i === 1 ? 0.35 * (1 - out3(since)) : 0;
      const rows = C.length === 1 ? `<div class="bg2">${wordHtml(C[0], t)}</div>` : `<div class="sm">${wordHtml(C[0], t)}</div><div class="bg2">${wordHtml(C[1], t)}</div>`;
      return `<div class="ph" style="top:${y.toFixed(0)}px;opacity:${op.toFixed(2)};filter:blur(${i < cur ? 3 : 0}px)">${rows}</div>`;
    }).join('');
  };
  const buildCard = c => {
    if (c.type === 'image') cardEl.innerHTML = `<img class="photo" src="${esc(c.src)}" alt="">`;
    else if (c.type === 'typo') cardEl.innerHTML = `<div class="halo"></div><div class="typo"></div>`;
    else cardEl.innerHTML = `<div class="halo"></div>${c.text ? `<div class="ghost">${esc(K(c.text))}</div>` : ''}<div class="obj tile">${c.svg || ''}</div>`;
  };
  // الانتقالات المقيسة من المراجع (GRAMMAR §3): لكل بطاقة دخول وخروج حسب نوعها أو in/out صريحة
  const cardEnd = c => c.at + (c.dur || 1.6);
  const big = (D.cards || []).filter(c => c.type !== 'prop');
  const TR = { scene: ['streak', 'whiteframe'], image: ['streak', 'whiteframe'], icon: ['defocus', 'flash'], typo: ['defocus', 'flash'], flow: ['flash', 'flash'] };
  const trOf = c => [c.in || (TR[c.type] || TR.icon)[0], c.out || (TR[c.type] || TR.icon)[1]];
  const shifts = [...(D.frames || []).flatMap(f => [f.from, f.to]), ...(D.behind || []).map(b => b.from)];
  const transit = t => {
    const o = { flash: 0, orb: 0, leak: null, wblur: 0, wdark: 0, wbright: 1, alpha: 1, cblur: 0, pip: 0, clip: null };
    for (const c of big) {
      const a = c.at, b = cardEnd(c), [ki, ko] = trOf(c);
      if (ki === 'streak' && Math.abs(t - a) < 0.2) o.leak = clamp((t - a + 0.2) / 0.4);
      if (ki === 'flash' && Math.abs(t - a) < 0.12) o.flash = Math.max(o.flash, 0.85 * (1 - Math.abs(t - a) / 0.12));
      if (ki === 'whiteframe' && Math.abs(t - a) < 0.034) o.flash = 1;

      }

      if (ki === 'pip' && t >= a - 0.5 && t < a) o.pip = out3((t - a + 0.5) / 0.5);
      if (ko === 'whiteframe' && Math.abs(t - b) < 0.034) o.flash = 1;
      if (ko === 'flash' && Math.abs(t - b) < 0.12) o.flash = Math.max(o.flash, 0.85 * (1 - Math.abs(t - b) / 0.12));

    }

  };
  const lc = $('#light').getContext('2d');
  const relight = (f, on) => {
    lc.clearRect(0, 0, 1080, 1920);
    if (!on) return;
    const cx = f ? f.cx : 540, cy = f ? f.cy : 760, r = f ? f.w : 480;
    const g2 = lc.createRadialGradient(cx, cy, r * 0.55, cx, cy + r * 0.6, r * 2.6);
    g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(0.55, 'rgba(0,0,0,.28)'); g2.addColorStop(1, 'rgba(0,0,0,.62)');
    lc.fillStyle = g2; lc.fillRect(0, 0, 1080, 1920);
    const key = lc.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 0, cx, cy, r * 1.1);
    key.addColorStop(0, 'rgba(255,236,210,.10)'); key.addColorStop(1, 'rgba(255,236,210,0)');

  };
  const vid = $('#vid'), person = $('#person'), wrap = $('#vidwrap'), behind = $('#behind'), paper = $('.paper'), pills = $('.pills');
  const overlap = (a, b) => !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  const inside = r => r.left >= 0 && r.right <= 1080 && r.top >= 0 && r.bottom <= 1920;
  const active = (list, t, pre = 0) => (list || []).find(x => t >= x.from - pre && t <= x.to + pre);
  let cardShown = null, uiShown = null, phoneShown = null;

  const render = t => {
    const cd = (D.cards || []).find(c => c.type !== 'prop' && t >= c.at - 0.05 && t <= c.at + (c.dur || 1.6));
    drawFx(t, !!cd);
    relight(D.face, !cd);
    const tr = transit(t), lk = $('#leak');
    const sh = shifts.find(e => t >= e - 0.25 && t <= e + 0.3);
    const lp = tr.leak !== null ? tr.leak : sh !== undefined ? clamp((t - sh + 0.25) / 0.55) : null;
    if (lp !== null) { lk.style.opacity = Math.sin(Math.PI * lp) * 0.95; lk.style.transform = `translateX(${(lp * 2 - 1) * 110}%)`; } else lk.style.opacity = 0;
    $('#flash').style.opacity = tr.flash.toFixed(2);
    $('#orb').style.opacity = tr.orb ? 1 : 0; $('#orb').style.setProperty('--r', `${(tr.orb * 110).toFixed(1)}%`);

    // نافذة الفيديو + رأس ورقي يُكتب
    const fr = active(D.frames, t, 0.45), fk = fr ? out3(io(t, fr.from, fr.to, 0.45)) : 0;
    $('#bg').style.opacity = fk;
    const sc = 1 - 0.32 * fk;
    wrap.style.transform = `translateY(${250 * fk}px) scale(${sc})`;
    wrap.style.borderRadius = `${56 * fk / sc}px`;
    wrap.style.boxShadow = fk ? `0 60px 120px -20px rgba(0,0,0,${0.7 * fk})` : 'none';
    if (tr.pip) { const p = tr.pip; wrap.style.transform = `translateY(${-560 * p}px) scale(${1 - 0.68 * p})`; wrap.style.borderRadius = `${90 * p / (1 - 0.68 * p)}px`; wrap.style.boxShadow = `0 0 0 ${(14 * p).toFixed(1)}px ${M.accent},0 40px 80px rgba(0,0,0,.6)`; $('#bg').style.opacity = p; }
    paper.style.opacity = fk; paper.style.transform = `translateY(${-60 * (1 - fk)}px)`;
    if (fr) { paper.querySelector('.num').textContent = fr.num ? `0${fr.num}`.slice(-2) : ''; paper.querySelector('h2').textContent = typed(fr.title || '', t, fr.from + 0.3); paper.querySelector('p').textContent = typed(fr.sub || '', t, fr.from + 0.3 + [...(fr.title || '')].length / 28); }

    const bh = active(D.behind, t, 0.4), bk = bh ? out3(io(t, bh.from, bh.to, 0.45)) : 0;
    if (bh && behind.dataset.k !== String(bh.from)) {
      behind.textContent = K(bh.text); behind.style.top = (bh.y || 120) + 'px'; behind.dataset.k = bh.from; behind.style.fontSize = '300px';
      const wd = behind.scrollWidth; if (wd > 1000) behind.style.fontSize = Math.floor(300 * 1000 / wd) + 'px';
    }
    behind.style.opacity = bk; behind.style.transform = `translateY(${60 * (1 - bk)}px)`;
    person.style.display = bk > 0 && D.person ? 'block' : 'none';

    const sp = active(D.spotlight, t, 0.3), ring = $('.ring'), rl = $('.ringlabel');
    if (sp && D.face) {
      const k = out3(io(t, sp.from, sp.to, 0.35)), f = D.face, cy = f.cy - f.w * 0.08, r = Math.min(470, f.w * 0.62);
      Object.assign(ring.style, { left: (f.cx - r) + 'px', top: (cy - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: k, transform: `scale(${0.8 + 0.2 * out3(k)}) rotate(${t * 30}deg)` });
      rl.textContent = typed(sp.label || '', t, sp.from + 0.2); Object.assign(rl.style, { left: f.cx + 'px', top: (cy - r - 100) + 'px', opacity: sp.label ? k : 0 });
    } else { ring.style.opacity = 0; rl.style.opacity = 0; }

    // أقراص المعلومات
    const ui = active(D.ui, t, 0.3);
    if (ui !== uiShown) { pills.innerHTML = ui ? `<div class="t"></div>` + (ui.items || []).map(() => `<div class="pill"><span></span></div>`).join('') : ''; uiShown = ui; }
    if (ui) {
      const k = io(t, ui.from, ui.to, 0.3); pills.style.opacity = k;
      pills.querySelector('.t').textContent = typed(ui.title || '', t, ui.from);
      pills.querySelectorAll('.pill').forEach((el, i) => {
        const a = ui.from + 0.15 + i * 0.22, q = out3(clamp((t - a) / 0.3));
        el.style.transform = `scaleX(${0.2 + 0.8 * q})`; el.style.opacity = q; el.style.transformOrigin = '50% 50%';
        el.style.setProperty('--sweep', `${120 - 240 * clamp((t - a) / 0.6)}%`);
        el.querySelector('span').innerHTML = mark(typed(ui.items[i], t, a + 0.25, 34));
      });
    } else pills.style.opacity = 0;

    const ph = active(D.phones, t, 0.4), pel = $('.phone');
    if (ph !== phoneShown) { if (ph) pel.querySelector('img').src = ph.src; phoneShown = ph; }
    if (ph) { const k = out3(io(t, ph.from, ph.to, 0.45)); pel.style.opacity = k; pel.style.transform = `translateY(${300 * (1 - k)}px) rotate(${-8 + 4 * k}deg)`; } else pel.style.opacity = 0;

    // مجسم بجانب الوجه
    const pr = (D.cards || []).find(c => c.type === 'prop' && t >= c.at && t <= c.at + (c.dur || 1.6));
    if (pr) {
      if (propEl.dataset.k !== String(pr.at)) { propEl.innerHTML = pr.svg || ''; propEl.dataset.k = pr.at; }
      const end = pr.at + (pr.dur || 1.6), q = clamp((t - pr.at) / 0.45), o = clamp((end - t) / 0.25), f = D.face || { cx: 540, cy: 760, w: 520 };
      const side = pr.side === 'left' ? -1 : 1, x = 540 + side * 360 - 125, y = (pr.y || 1060);
      Object.assign(propEl.style, { left: x + 'px', top: y + 'px', opacity: Math.min(1, q * 2) * o, transform: `translateY(${Math.sin(t * 2.4) * 12}px) scale(${0.3 + 0.7 * back(q)}) rotate(${side * (12 - 12 * q)}deg)` });
    } else propEl.style.opacity = 0;

    // بطاقة كاملة / مشهد / تدفق نص

      if (ob) ob.style.transform = `translateY(${Math.sin(t * 2.2) * 16}px) scale(${0.85 + 0.15 * ent + 0.04 * clamp((t - cd.at) / (end - cd.at))})`;
      if (ty) ty.textContent = typed(K(cd.text || ''), t, cd.at + 0.15, 22);

    const qt = active(D.quotes, t, 0.2), qel = $('.quote');
    if (qt) { if (qel.dataset.k !== String(qt.from)) { qel.textContent = qt.text || spokenIn(qt.from, qt.to).map(w => w.w).join(' '); qel.dataset.k = qt.from; } const k = io(t, qt.from, qt.to, 0.25); qel.style.opacity = k; qel.style.filter = `blur(${(8 * (1 - k)).toFixed(1)}px)`; } else qel.style.opacity = 0;

      const f = D.face;

      cap.style.top = (f ? Math.min(1420, Math.max(side ? 760 : 1000, side ? f.cy - f.w * 0.1 : f.cy + f.w * 0.62)) : 1180) + 'px';

      for (const el of [pills, $('.phone'), propEl]) if (+getComputedStyle(el).opacity > 0.99 && cap.children.length && overlap(el.getBoundingClientRect(), cap.getBoundingClientRect())) window.__issues.push(`عنصر فوق الكابشن عند ${t.toFixed(2)}ث`);
    } else cap.innerHTML = '';

    if (p) { if (pop.dataset.at != p.at) { pop.innerHTML = mark(p.text); pop.dataset.at = p.at; } const k = clamp((t - p.at) / 0.35), o = clamp((p.at + 1.6 - t) / 0.2); pop.style.opacity = Math.min(k * 2, o); pop.style.transform = `translate(-50%,-50%) scale(${0.8 + 0.2 * back(k)})`; }
    else pop.style.opacity = 0;
    $('.bar').style.width = (100 * t / D.duration) + '%';
  };

  const load = (img, src) => new Promise(res => { if (!src || img.getAttribute('src') === src) { res(); return; } img.onload = img.onerror = () => res(); img.src = src; });
