<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Talk overlay</title>
<link rel="stylesheet" href="../templates/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:'Alexandria',sans-serif}
/* الكابشن فوق المنطقة الآمنة للريلز */
.cap{position:absolute;left:508px;transform:translateX(-50%);max-width:824px;width:max-content;bottom:420px;padding:10px 34px;border-radius:36px;background:rgba(8,42,43,.62);display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;font-size:84px;font-weight:800;line-height:1.35;text-align:center}
.w{color:#fff;text-shadow:0 4px 0 rgba(8,42,43,.9),0 0 28px rgba(8,42,43,.85);display:inline-block}
.w.on{color:var(--accent)}
.w.em{background:var(--accent);color:var(--bgDark);text-shadow:none;border-radius:18px;padding:0 18px}
.pop{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);background:var(--bgDark);border:4px solid var(--accent);color:var(--ink);border-radius:44px;padding:40px 64px;font-size:110px;font-weight:800;white-space:nowrap;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.pop .a{color:var(--accent)}.pop .n{color:var(--numbers)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:'Inter','Alexandria',sans-serif}
.bar{position:absolute;bottom:0;right:0;height:10px;background:var(--accent)}
</style>
</head>
<body>
<div class="pop" style="opacity:0"></div>
<div class="cap"></div>
<div class="bar"></div>
<script>
(() => {
  const D = window.__TALK, T = D.tokens;
  for (const [k, v] of Object.entries(T.color)) document.documentElement.style.setProperty('--' + k, v);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mark = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="n ltr">$1</span>').replace(/\{([^}]+)\}/g, '<span class="a ltr">$1</span>');
  const em = new Set(D.emphasis || []);
  // تجميع الكلمات في دفعات: 3 كلمات أو عند وقفة
  const chunks = [];
  for (const w of D.words) {
    const last = chunks[chunks.length - 1];
    if (!last || last.length >= 3 || w.s - last[last.length - 1].e > 0.35) chunks.push([w]); else last.push(w);
  }
  const cap = document.querySelector('.cap'), pop = document.querySelector('.pop'), bar = document.querySelector('.bar');
  const back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  let shown = null;
  window.__seek = ms => {
    const t = ms / 1000;
    const c = chunks.find(ch => t >= ch[0].s - 0.05 && t <= ch[ch.length - 1].e + 0.25);
    if (c !== shown) {
      cap.style.visibility = c ? 'visible' : 'hidden';
      cap.innerHTML = c ? c.map(w => `<span class="w${em.has(w.w) ? ' em' : ''}">${esc(w.w)}</span>`).join('') : '';
      shown = c;
    }
    if (c) [...cap.children].forEach((el, i) => {
      const w = c[i], on = t >= w.s && t <= w.e + 0.05;
      el.classList.toggle('on', on && !el.classList.contains('em'));
      const k = Math.min(1, Math.max(0, (t - w.s) / 0.18));
      el.style.transform = `scale(${t < w.s ? 0.92 : 0.92 + 0.08 * back(k)})`;
      el.style.opacity = t < w.s - 0.05 ? 0.55 : 1;
    });
    const p = (D.pops || []).find(x => t >= x.at && t <= x.at + 1.4);
    if (p) {
      if (pop.dataset.at != p.at) { pop.innerHTML = mark(p.text); pop.dataset.at = p.at; }
      const k = Math.min(1, (t - p.at) / 0.35), out = Math.min(1, Math.max(0, (p.at + 1.4 - t) / 0.2));
      pop.style.opacity = Math.min(k * 2, out);
      pop.style.transform = `translate(-50%,-50%) scale(${0.7 + 0.3 * back(k)})`;
    } else pop.style.opacity = 0;
    bar.style.width = (100 * t / D.duration) + '%';
  };
  window.__ready = true;
})();
</script>
</body>
</html>
