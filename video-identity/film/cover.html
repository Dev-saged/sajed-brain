<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../templates/fonts.css">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#0F3D3E;font-family:'Alexandria',sans-serif;color:#F1F1F1}
.g{position:absolute;inset:0;background-image:linear-gradient(#24585A 2px,transparent 2px),linear-gradient(90deg,#24585A 2px,transparent 2px);background-size:120px 120px;opacity:.3}
.w{position:absolute;left:0;top:0;width:1080px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(212,166,74,.3),transparent 62%);transform:translate(0,380px)}
.who{position:absolute;right:90px;top:110px;display:flex;align-items:center;gap:30px}.who img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:6px solid #D4A64A}
.who b{display:block;font-size:56px;font-weight:600}.who i{font-style:normal;font-size:40px;color:#B7CFCB}
h1{position:absolute;left:90px;right:90px;top:330px;font-size:150px;font-weight:800;line-height:1.18}h1 span{color:#D4A64A}
.sub{position:absolute;right:90px;top:700px;font-size:56px;color:#B7CFCB}
.ph{position:absolute;left:260px;top:830px;width:560px;height:1040px;border-radius:70px;border:13px solid #061f20;background:#061f20;box-shadow:0 0 0 3px #24585A,0 70px 120px -30px rgba(0,0,0,.7);overflow:hidden;transform:rotate(-4deg)}
.ph img{width:100%;height:100%;object-fit:cover}
.t{position:absolute;background:#D4A64A;color:#082A2B;font-weight:800;font-size:44px;padding:18px 34px;border-radius:34px}
</style></head><body><div class="g"></div><div class="w"></div>
<div class="who"><img id="p"><div><b>ساجد العبادلة</b><i>مطوّر من غزة</i></div></div>
<h1>استوديو<br><span>المقالات</span></h1><div class="sub">اكتب · صمّم · انشر — من هاتفك</div>
<div class="ph"><img id="f"></div>
<div class="t" style="left:50px;top:1010px;transform:rotate(-4deg)">٦ مزوّدين · بلا توقف</div>
<div class="t" style="left:430px;top:1480px;transform:rotate(3deg)">عدة مواقع بالتوازي</div>
<script>const q=new URLSearchParams(location.search);document.getElementById('p').src=q.get('p');document.getElementById('f').src=q.get('f');</script></body></html>
