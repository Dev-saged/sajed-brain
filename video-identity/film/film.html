<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Sajed film</title>
<link rel="stylesheet" href="../templates/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bgDark)}
body{font-family:'Alexandria',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:'Inter','Alexandria',sans-serif}
.n{color:var(--numbers)}.a{color:var(--accent)}
#bg{position:absolute;inset:0;background:var(--bgDark);overflow:hidden}
#grid{position:absolute;left:-120px;top:-120px;right:-120px;bottom:-120px;background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:120px 120px;opacity:.3}
#glow{position:absolute;left:0;top:0;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(212,166,74,.24),transparent 62%)}
#stage{position:absolute;inset:0;overflow:hidden;transform-origin:50% 45%}
.sc{position:absolute;inset:0;opacity:0;pointer-events:none}
#wipe{position:absolute;top:0;bottom:0;width:260px;background:linear-gradient(90deg,transparent,var(--accent) 50%,transparent);opacity:0;mix-blend-mode:screen}
#bar{position:absolute;bottom:0;right:0;height:10px;background:var(--accent)}
#cap{position:absolute;left:90px;right:90px;top:1424px;text-align:center;font-weight:400;font-size:40px;line-height:1.5;color:var(--ink);min-height:120px}
#cap span{color:var(--mute)}#cap span.on{color:var(--ink)}
/* hook */
.chip{position:absolute;right:96px;top:120px;display:flex;align-items:center;gap:32px}
.chip img{width:156px;height:156px;border-radius:50%;object-fit:cover;border:6px solid var(--accent)}
.chip b{display:block;font-size:58px;font-weight:600}.chip i{display:block;font-style:normal;font-size:42px;color:var(--mute);margin-top:6px}
.term{position:absolute;left:96px;top:700px;font-family:'JetBrains Mono',monospace;font-size:38px;color:var(--mute);direction:ltr;white-space:pre}
.head{position:absolute;right:96px;left:96px;top:780px;font-size:132px;font-weight:800;line-height:1.22;white-space:pre-line}
.sub{position:absolute;right:96px;top:1140px;font-size:58px;color:var(--mute)}
.cur{color:var(--accent)}
.h2{position:absolute;right:90px;left:90px;top:120px;font-size:92px;font-weight:800;line-height:1.25;text-align:center;white-space:pre-line}
.h2 .a{background:linear-gradient(transparent 64%,rgba(212,166,74,.35) 64%)}
/* phone */
.phone{position:absolute;left:226px;top:316px;width:628px;height:1173px;border-radius:78px;border:14px solid #061f20;background:#061f20;box-shadow:0 0 0 3px var(--line),0 70px 120px -30px rgba(0,0,0,.6);opacity:0;transform-origin:50% 50%}
.scr{position:absolute;inset:0;border-radius:62px;overflow:hidden;background:#101d1d}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ring{position:absolute;border:5px solid var(--accent);border-radius:46px;opacity:0;box-shadow:0 0 40px rgba(212,166,74,.6)}
.tag{position:absolute;background:var(--accent);color:#082A2B;font-weight:800;font-size:40px;padding:16px 30px;border-radius:30px;opacity:0;white-space:nowrap}
.big{position:absolute;opacity:0;text-align:center;background:#082A2B;border:3px solid var(--accent);border-radius:36px;padding:14px 22px;width:260px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.big b{display:block;font-family:'Inter',sans-serif;font-weight:800;font-size:88px;line-height:1.05;color:var(--numbers)}
.big span{display:block;font-size:34px;color:var(--mute);margin-top:4px}
/* lanes */
.lanes{position:absolute;left:90px;right:90px;top:420px;display:flex;flex-direction:column;gap:30px}
.lane{height:150px;border-radius:40px;background:var(--bg2,#082A2B);border:2px solid var(--tb,#2E6A6B);padding:26px 40px;opacity:0}
.lane div.t{display:flex;justify-content:space-between;font-size:44px;font-weight:600}
.lane div.t em{font-style:normal;font-size:32px;color:var(--accent)}
.lane div.k{height:14px;border-radius:7px;background:var(--line);margin-top:26px;overflow:hidden;position:relative}
.lane div.k i{position:absolute;top:0;bottom:0;right:0;border-radius:7px;background:var(--accent)}
/* cards */
.rows{position:absolute;left:90px;right:90px;top:390px;display:flex;flex-direction:column;gap:26px}
.row{height:178px;border-radius:44px;background:#082A2B;border:2px solid #2E6A6B;display:flex;align-items:center;gap:34px;padding:0 34px;opacity:0}
.row .ib{width:112px;height:112px;border-radius:32px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row h3{font-size:50px;font-weight:800}.row p{font-size:34px;color:var(--mute);margin-top:8px;font-weight:400}
.row .ck{margin-right:auto;width:60px;height:60px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center}
/* outro */
.pic{position:absolute;left:372px;top:150px;width:336px;height:336px;border-radius:50%;object-fit:cover;border:12px solid var(--accent)}
.o1{position:absolute;left:0;right:0;top:530px;text-align:center;font-size:92px;font-weight:800}
.o2{position:absolute;left:0;right:0;top:660px;text-align:center;font-size:50px;color:var(--mute)}
.tiles{position:absolute;left:70px;right:70px;top:790px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tile{direction:ltr;display:flex;align-items:center;gap:20px;height:118px;padding:0 18px 0 14px;border-radius:34px;background:#082A2B;border:2px solid #2E6A6B;opacity:0}
.tile .ib{width:84px;height:84px;border-radius:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile b{font-family:'Inter',sans-serif;font-weight:700;font-size:38px;color:#fff;white-space:nowrap}
</style></head><body>
<div id="bg"><div id="grid"></div><div id="glow"></div></div>
<div id="stage">
 <div class="sc" id="s1">
  <div class="chip"><img class="portrait"><div><b class="name"></b><i class="intro"></i></div></div>
  <div class="term"></div><div class="head"></div><div class="sub"></div>
 </div>
 <div class="sc" id="s2"><div class="h2"></div></div>
 <div class="sc" id="s3"><div class="h2"></div></div>
 <div class="sc" id="s4"><div class="h2"></div><div class="rows"></div></div>
 <div class="sc" id="s5"><div class="h2"></div></div>
 <div class="sc" id="s6"><img class="pic portrait"><div class="o1 name"></div><div class="o2 outro"></div><div class="tiles"></div></div>

 <div class="phone" id="phA"><div class="scr"><div class="cam" id="camA"><img id="fa"><img id="fb">
   <div class="ring" id="ringA" style="left:56px;top:262px;width:164px;height:164px;border-radius:50%"></div></div></div></div>
 <div class="phone" id="phB"><div class="scr"><div class="cam" id="camB"><img id="cov" style="height:auto;object-fit:fill"></div></div></div>
 <div class="tag" id="tagA">تعثّر ← تبديل تلقائي</div>
 <div class="big" id="big1" style="left:560px;top:1215px"><b class="ltr" id="n6">0</b><span>مزوّدين</span></div>
 <div class="big" id="big2" style="left:260px;top:1215px"><b class="ltr" id="n591">0</b><span>كلمة / مقال</span></div>
 <div class="tag" id="tagB" style="left:370px;top:1250px">TCNOPS · سبورت لايف</div>
 <div class="tag" id="tagC" style="left:340px;top:1260px;font-family:'Inter',sans-serif">sport1live24.blogspot.com</div>
 <div id="wipe"></div>
 <div id="cap"></div>
 <div id="bar"></div>
</div>
<script>
(() => {
  const B = window.__BRAND; if (!B) { document.body.textContent = 'شغّل عبر film.py'; return; }
  const T = B.tokens, SC = B.timeline, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  for (const [k, v] of Object.entries(T.color)) document.documentElement.style.setProperty('--' + k, v);
  const clamp = v => Math.min(1, Math.max(0, v)), p = (t, a, d) => clamp((t - a) / d);
  const o3 = x => 1 - Math.pow(1 - x, 3), io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
  const S = (el, o, dy = 0, dx = 0, sc = 1, rot = 0) => { el.style.opacity = o; el.style.transform = `translate(${dx}px,${dy}px) scale(${sc}) rotate(${rot}deg)`; };
  const I = T.identity;
  $$('.portrait').forEach(i => i.src = B.assets.portrait);
  $$('.name').forEach(e => e.textContent = I.name); $('.intro').textContent = I.introTag; $('.outro').textContent = I.outroTag;
  $('#cov').src = B.assets.covers;
  const frames = []; for (let i = 0; i < B.assets.frameCount; i++) { const im = new Image(); im.src = B.assets.frames.replace('%03d', String(i + 1).padStart(3, '0')); frames.push(im); }
  window.__ready = () => Promise.all([...frames, $('#cov')].map(im => im.decode ? im.decode().catch(() => 0) : 0)).then(() => document.fonts.ready).then(() => true);
  const rec = tt => { const f = Math.min(frames.length - 2, Math.max(0, tt * B.assets.fps)), a = Math.floor(f); $('#fa').src = frames[a].src; $('#fb').src = frames[a + 1].src; $('#fb').style.opacity = f - a; };
  const hl = (s, el) => el.innerHTML = s.replace(/\{([^}]*)\}/g, '<span class="a">$1</span>').replace(/\[([^\]]*)\]/g, '<span class="n ltr">$1</span>');

  const lines = B.lines;
  const cap = (i, lt) => { // كابشن كلمة بكلمة بمدى زمن الصوت
    const w = lines[i].split(' '), d = SC.voice[i], n = Math.floor(w.length * clamp((lt - .15) / (d * .96)));
    $('#cap').innerHTML = w.map((x, k) => `<span class="${k < n ? 'on' : ''}">${x}</span>`).join(' ');
  };
  const ic = d => `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0F3D3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const CARDS = [
    ['M7 7h11l-3-3 M17 17H6l3 3', 'تبديل تلقائي', 6, 'مزوّدي ذكاء بلا توقف'],
    ['M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z M9 12l2 2 4-4', 'حواجز دقة', 3, 'مجال · أرقام موثّقة · بلا تكرار'],
    ['M4 5h16v14H4z M4 15l5-5 4 4 3-3 4 4 M15 9h.01', 'أغلفة واقعية', 6, 'مصادر صور + رسم احتياطي'],
    ['M4 6h16 M4 12h16 M4 18h16 M8 4v4 M15 10v4 M11 16v4', 'عمل متوازٍ', 3, 'مقالات معاً لكل موقع'],
    ['M12 16V4 M7 9l5-5 5 5 M4 20h16', 'نشر مباشر', 91, 'اختباراً آلياً أخضر']
  ];
  $('.rows').innerHTML = CARDS.map(c => `<div class="row"><div class="ib">${ic(c[0])}</div><div><h3>${c[1]}</h3><p><b class="ltr n cnt" style="font-weight:800;font-size:40px">0</b> ${c[3]}</p></div><div class="ck"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D4A64A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tk" d="M5 12.5l4.5 4.5L19 7" stroke-dasharray="30" stroke-dashoffset="30"/></svg></div></div>`).join('');
  const rows = $$('.row'), cnts = $$('.cnt'), ticks = $$('.tk');
  $('.tiles').innerHTML = Object.values(B.icons.icons).map(v => `<div class="tile"><div class="ib"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${T.accountTile.iconStroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${v.d}"/></svg></div><b>${v.handle}</b></div>`).join('');
  const tiles = $$('.tile');

  const head = 'ثلاثة مواقع.\n{تطبيق واحد}', htk = [...head.replace(/[{}]/g, '')].length;
  const term = `${I.terminalPath} $ run article-studio`;
  const typed = (txt, n) => { let out = '', idx = 0, open = false; for (const ch of txt) { if (ch === '{') { out += '<span class="a">'; open = true; continue } if (ch === '}') { out += '</span>'; open = false; continue } if (idx++ < n) out += ch === '\n' ? '\n' : ch } return out + (open ? '</span>' : ''); };

  const scenes = [
    lt => { // 1 hook
      const c = o3(p(lt, 0, .6)); S($('.chip'), c, -60 * (1 - c));
      $('.term').textContent = term.slice(0, Math.round(term.length * p(lt, .25, .7)));
      const n = Math.round(htk * p(lt, 1, 1.3)), end = 2.3, blink = lt > end && Math.floor((lt - end) / .53) % 2;
      $('.head').innerHTML = typed(head, n) + (blink ? '' : '<span class="cur">▍</span>');
      const u = o3(p(lt, end, .5)); $('.sub').textContent = 'مقالات بلا توقف'; S($('.sub'), u, 30 * (1 - u));
    },
    lt => { // 2 غرفة التحكم + الملعب
      hl('غرفة تحكّم\n{في جيبك}', $('.h2', $('#s2')));
      const ph = $('#phA'), e = back(p(lt, 0, .9));
      ph.style.opacity = clamp(e * 1.6); ph.style.transform = `translateY(${(1 - e) * 420 + (lt > .9 ? Math.sin(lt * 1.4) * 6 : 0)}px) scale(.9) rotateX(${(1 - e) * 22}deg) rotateZ(${-3 * (1 - e)}deg)`;
      ph.style.perspective = '1400px';
      rec(.15 + (lt * .06));
      const z = 1 + .3 * io(p(lt, 1.2, 3.5)) - .3 * io(p(lt, 7, 2)), cy = 330 * io(p(lt, 1.2, 3.5)) - 330 * io(p(lt, 7, 2));
      $('#camA').style.transform = `translateY(${cy * .35}px) scale(${z})`;
      $('#camA').style.transformOrigin = '23% 30%';
      const ring = $('#ringA'); const pulse = 1 + .12 * Math.sin(lt * 7);
      ring.style.opacity = io(p(lt, 2.2, .5)) * (1 - p(lt, 7.5, .6)); ring.style.transform = `scale(${pulse})`;
      const t = back(p(lt, 2.8, .6)); S($('#tagA'), clamp(t), 0, 0, .8 + .2 * t); Object.assign($('#tagA').style, { left: '315px', top: '535px' });
      $('#tagA').style.opacity = clamp(t) * (1 - p(lt, 7.5, .6));
      $('#n6').textContent = Math.round(6 * o3(p(lt, 4, 1)));
      const b = back(p(lt, 4, .8)); S($('#big1'), clamp(b) * (1 - p(lt, 8, .5)), 0, 0, .7 + .3 * b);
      $('#n591').textContent = Math.round(591 * o3(p(lt, 5.8, 1.1)));
      const b2 = back(p(lt, 5.8, .8)); S($('#big2'), clamp(b2) * (1 - p(lt, 8, .5)), 0, 0, .7 + .3 * b2);
    },
    lt => { // 3 تبديل المواقع (لقطة حقيقية، حركة بطيئة)
      hl('{كل موقع}\nبمهامه المستقلة', $('.h2', $('#s3')));
      const ph = $('#phA'); ph.style.opacity = 1; ph.style.transform = `translateY(${Math.sin(lt * 1.4) * 6}px) scale(.9)`;
      rec(.9 + lt * .47);
      const z = 1 + .22 * io(p(lt, .4, 1.6)) - .22 * io(p(lt, 6.8, 1.6));
      $('#camA').style.transformOrigin = '50% 75%'; $('#camA').style.transform = `scale(${z})`;
      $('#ringA').style.opacity = 0; $('#tagA').style.opacity = 0; $('#big1').style.opacity = 0; $('#big2').style.opacity = 0;
      const t = back(p(lt, 2.6, .6)); S($('#tagB'), clamp(t), 0, 0, .8 + .2 * t); $('#tagB').style.opacity = clamp(t) * (1 - p(lt, 8, .5));
    },
    lt => { // 4 المميزات
      hl('ما يجعله {مختلفاً}', $('.h2', $('#s4')));
      $('#phA').style.opacity = 0; $('#tagB').style.opacity = 0;
      const d = 1.4;
      rows.forEach((r, i) => { const a = back(p(lt, .5 + i * d, .6)); S(r, clamp(a * 1.5), 0, 200 * (1 - a), 1);
        r.style.borderColor = lt > .5 + i * d + .5 ? 'var(--accent)' : '#2E6A6B';
        cnts[i].textContent = Math.round(CARDS[i][2] * o3(p(lt, .8 + i * d, .7)));
        ticks[i].style.strokeDashoffset = 30 * (1 - p(lt, 1.2 + i * d, .35)); });
    },
    lt => { // 5 النتيجة الحقيقية
      hl('نتيجة {حقيقية}\nعلى مدوّنتي', $('.h2', $('#s5')));
      const ph = $('#phB'), e = back(p(lt, 0, .9));
      ph.style.opacity = clamp(e * 1.6); ph.style.transform = `translateY(${(1 - e) * 420}px) scale(.9) rotateX(${(1 - e) * 22}deg)`;
      const h = 628 - 28; const imgH = h * 2060 / 720; const cov = $('#cov'); cov.style.width = '100%'; cov.style.height = imgH + 'px';
      $('#camB').style.transform = `translateY(${-(imgH - 1145) * io(p(lt, .8, 3.2)) * .62}px)`;
      const t = back(p(lt, 1.6, .6)); S($('#tagC'), clamp(t), 0, 0, .85 + .15 * t); $('#tagC').style.left = '330px'; $('#tagC').style.top = '1270px'; $('#tagC').style.fontSize = '34px';
    },
    lt => { // 6 الخاتمة
      const pic = back(p(lt, 0, .7)); S($('.pic'), clamp(pic), 0, 0, .6 + .4 * pic);
      const a = o3(p(lt, .35, .5)); S($('.o1'), a, 30 * (1 - a)); const b = o3(p(lt, .55, .5)); S($('.o2'), b, 30 * (1 - b));
      tiles.forEach((el, i) => { const x = o3(p(lt, .8 + i * .12, .45)); S(el, x, 40 * (1 - x)); });
    }
  ];

  window.__seek = t => {
    t = Math.min(t, SC.total - .001);
    let i = SC.starts.findIndex((s, k) => t >= s && (k === SC.starts.length - 1 || t < SC.starts[k + 1]));
    const lt = t - SC.starts[i];
    $$('.sc').forEach((el, k) => el.style.opacity = k === i ? o3(p(lt, 0, .3)) * (1 - p(lt, SC.durs[i] - .25, .25)) : 0);
    if (i !== 1 && i !== 2) $('#phA').style.opacity = 0;
    if (i !== 4) $('#phB').style.opacity = 0;
    ['#big1', '#big2', '#tagA', '#tagB', '#tagC'].forEach(s => { if (!((i === 1 && /big|tagA/.test(s)) || (i === 2 && s === '#tagB') || (i === 4 && s === '#tagC'))) $(s).style.opacity = 0; });
    scenes[i](lt);
    cap(i, lt);
    $('#cap').style.opacity = i === 3 ? 0 : 1 ;
    $('#glow').style.transform = `translate(${-250 + 200 * Math.sin(t / 1.4)}px,${250 + 140 * Math.cos(t / 1.8)}px)`;
    $('#grid').style.transform = `translateY(${(t * 26) % 120}px)`;
    $('#stage').style.transform = `scale(${1 + .018 * Math.sin(t * .9)})`;
    const w = $('#wipe'), near = SC.starts.slice(1).reduce((m, x) => Math.abs(t - x) < Math.abs(t - m) ? x : m, SC.starts[1]), k = (t - near + .15) / .55;
    w.style.opacity = k > 0 && k < 1 ? Math.sin(Math.PI * k) * .9 : 0; w.style.left = (1080 - 1340 * clamp(k)) + 'px';
    $('#bar').style.width = (100 * t / SC.total) + '%';
  };
  window.__seek(0);
})();
</script></body></html>
