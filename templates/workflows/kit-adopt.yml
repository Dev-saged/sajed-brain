name: kit-adopt

on:
  workflow_dispatch:
    inputs:
      version:
        description: "إصدار sajed-kit"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  adopt:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: Dev-saged/sajed-brain
          token: ${{ secrets.GH_PAT }}
          path: .brain
      - name: Adopt
        id: run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 .brain/scripts/kit.py adopt . --manifest .brain/index/kit-manifest.json --kit-version "$VERSION" --body "$RUNNER_TEMP/pr.md"
          rm -rf .brain
          git status --porcelain | grep -q . && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Open draft PR
        if: steps.run.outputs.changed == 'true'
        run: |
          branch="chore/adopt-sajed-kit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-robot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "refactor: use shared sajed-kit functions"
          git push -u origin "$branch"
          gh pr create --draft --title "refactor: use shared sajed-kit functions" --body-file "$RUNNER_TEMP/pr.md" --base "${GITHUB_REF_NAME}" --head "$branch"
