name: auto-maintain

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Dev-saged/sajed-brain
          token: ${{ secrets.GH_PAT }}
          path: .brain

      - name: Maintain
        id: run
        run: |
          note=""
          [ "$HAS_PAT" = "true" ] || note="ملاحظة: بلا GH_PAT لا يعمل build.yml على هذا الـPR؛ أضف السر."
          python3 .brain/scripts/auto_maintain.py . --body "$RUNNER_TEMP/pr.md" --note "$note" | tee "$RUNNER_TEMP/out.txt"
          grep -q "changed=true" "$RUNNER_TEMP/out.txt" && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          rm -rf .brain

      - name: Open PR
        if: steps.run.outputs.changed == 'true'
        run: |
          branch="chore/auto-maintain-$(date +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "الفرع موجود، لا PR جديد"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-robot@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: weekly maintenance"
          git push -u origin "$branch"
          gh pr create --title "chore: weekly maintenance" --body-file "$RUNNER_TEMP/pr.md" --base "${GITHUB_REF_NAME}" --head "$branch"
