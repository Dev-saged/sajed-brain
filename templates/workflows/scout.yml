name: scout

on:
  push:
    branches: [main]
    paths: ["**.kt", "**.kts", "**.xml", "gradle/libs.versions.toml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dev-saged/sajed-brain
          token: ${{ secrets.GH_PAT }}
          path: .brain
      - name: Scout
        run: python3 .brain/scripts/scout.py . --out docs
      - name: Deps radar
        run: python3 .brain/scripts/deps_radar.py . --out docs
        continue-on-error: true
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-robot@users.noreply.github.com"
          git add docs/symbol-index.tsv docs/scout-report.md docs/scout.json docs/scout-history.tsv docs/deps-report.md
          git diff --cached --quiet || (git commit -m "chore: refresh scout report [skip ci]" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
      - name: Gate
        run: python3 .brain/scripts/scout.py . --no-write --fail-on error
