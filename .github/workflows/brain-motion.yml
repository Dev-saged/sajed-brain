name: brain-motion

on:
  push:
    branches: [main]
    paths:
      - "video-identity/references/motion/inbox/**"
      - "video-identity/references/motion/links.txt"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brain-write
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Analyze new motion references
        run: python3 scripts/motion_refs.py

      - name: Map
        run: python3 scripts/brain_map.py

      - name: Commit
        run: |
          git config user.name  "sajed-brain[bot]"
          git config user.email "brain@dev-saged.local"
          git add -A video-identity/references/motion index/MAP.md
          git diff --cached --quiet || git commit -m "brain: analyze new motion references"
          git push
