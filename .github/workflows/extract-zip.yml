name: Extract ZIP into repository root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check ZIP file exists
        run: test -f sajed-brain.zip

      - name: Extract ZIP contents into repository root
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          unzip -q sajed-brain.zip -d "$temp_dir"

          shopt -s dotglob nullglob
          entries=("$temp_dir"/*)

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            source_dir="${entries[0]}"
          else
            source_dir="$temp_dir"
          fi

          cp -a "$source_dir"/. .
          rm -rf "$temp_dir"
          rm sajed-brain.zip

      - name: Commit extracted files and remove ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi

          git commit -m "Extract ZIP contents into repository root"
          git push
