name: Extract ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check ZIP file exists
        run: test -f sajed-brain.zip

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o sajed-brain.zip -d extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/

          if git diff --cached --quiet; then
            echo "No new extracted files to commit."
            exit 0
          fi

          git commit -m "Extract sajed-brain.zip"
          git push
