name: Extract ZIP into repository root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check ZIP file exists
        run: test -f sajed-brain.zip

      - name: Extract ZIP safely
        shell: bash
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          unzip -q sajed-brain.zip -d "$temp_dir"

          shopt -s dotglob nullglob
          entries=("$temp_dir"/*)

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            source_dir="${entries[0]}"
          else
            source_dir="$temp_dir"
          fi

          rm -rf "$source_dir/.github/workflows"

          cp -a "$source_dir"/. .
          rm -rf "$temp_dir"
          rm -f sajed-brain.zip

      - name: Commit extracted files and remove ZIP
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-robot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة للـcommit."
            exit 0
          fi

          git commit -m "Extract ZIP contents into repository root"
          git push origin main
